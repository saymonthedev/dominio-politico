name: Cópia de segurança

# Todo dia, uma cópia do banco (esquemas public e private), criptografada com
# uma senha guardada nos segredos do repositório. Fica 30 dias nos artefatos.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conferir segredos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Cadastre SUPABASE_DB_URL e BACKUP_PASSPHRASE em Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Exportar e criptografar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="dominio-politico-$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --schema=private --no-owner --no-privileges --format=custom --file "$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 --output "$name.dump.gpg" "$name.dump"
          rm "$name.dump"
          ls -lh "$name.dump.gpg"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.gpg
          retention-days: 30
